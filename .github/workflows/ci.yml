name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The pure-module tests need no install; the index.test.ts dispatcher
      # harness needs the pi SDK (a registry-resolvable peer dep) and skips
      # itself when the SDK is absent. Install the lockfile so the full suite
      # runs, but a registry hiccup must not mask the SDK-free tests: on
      # install failure the suite still runs (the harness skips).
      - name: Install
        run: npm ci || echo "install failed - SDK-dependent tests will skip"
      # npm test holds the glob (src/**/*.test.ts, so src/shells/ too); keep
      # CI on it so the two cannot drift apart.
      - name: Test
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    # Blocking: the pi SDK peer deps resolve from the public npm registry (see
    # package-lock.json), so type errors here are real regressions, not
    # missing-types noise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
